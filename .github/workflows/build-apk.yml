name: Build Dual Island Manager APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract Android source snapshot
        run: |
          tar -xJf dual-island-source.tar.xz
          cp -a DualIslandManager/app .
          cp DualIslandManager/build.gradle DualIslandManager/settings.gradle DualIslandManager/gradle.properties .
          cp DualIslandManager/README.md README.md
      - name: Publish Android source as browsable files
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app build.gradle settings.gradle gradle.properties README.md
          if ! git diff --cached --quiet; then
            git commit -m "Publish Android source files"
            git push origin HEAD:main
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK and install API 36
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dual-island-manager-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct-download test APK
        if: success()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.0.0-test >/dev/null 2>&1 || gh release create v1.0.0-test --title "Dual Island Manager v1 test build" --notes "Experimental debug-signed Android APK. Test before everyday use. You may need to uninstall an earlier test version before updating if its debug signing key has changed." --prerelease
          gh release upload v1.0.0-test app/build/outputs/apk/debug/app-debug.apk --clobber
